<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GREYBOX ARENA — retro fighting game (work in progress)</title>
    <link rel="icon" href="data:," />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #14161f;
        color: #cfd3e6;
        font-family: monospace;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      canvas {
        image-rendering: pixelated;
        background: #000;
      }
      #hint {
        font-size: 12px;
        color: #6b7089;
        text-align: center;
        line-height: 1.6;
      }
      #hint b { color: #9aa1c2; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hint">
      <b>P1</b> WASD move &nbsp;U/I/O punches&nbsp; J/K/L kicks &middot;
      <b>P2</b> arrows move &nbsp;7/8/9 punches&nbsp; 4/5/6 kicks (numpad) &middot; gamepads supported<br />
      fireball: &darr;&searr;&rarr;+punch &middot; uppercut: &rarr;&darr;&searr;+punch &middot; throw: close LP+LK &middot;
      hold back to block (crouch for lows) &middot; <b>F1</b> hitboxes &middot; <b>Enter</b> rematch
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
